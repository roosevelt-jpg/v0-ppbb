<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#145c46"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#g)"/>
  <text x="48" y="90" fill="#dff5e8" font-family="Avenir Next,sans-serif" font-size="42" font-weight="700">Text → African speech</text>
  <text x="48" y="150" fill="#9fceb8" font-family="Avenir Next,sans-serif" font-size="22">Live waveform preview · dialect-aware TTS</text>
  <rect x="48" y="220" width="864" height="180" rx="24" fill="rgba(255,255,255,0.08)"/>
  <g fill="#6fcf9c">
    <rect x="80" y="280" width="12" height="60" rx="4"><animate attributeName="height" values="40;100;40" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="110" y="260" width="12" height="100" rx="4"><animate attributeName="height" values="70;40;90" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="140" y="270" width="12" height="80" rx="4"><animate attributeName="height" values="50;110;50" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="170" y="250" width="12" height="120" rx="4"><animate attributeName="height" values="90;50;100" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="200" y="275" width="12" height="70" rx="4"><animate attributeName="height" values="40;95;40" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>
  <text x="48" y="470" fill="#cfe9db" font-family="Avenir Next,sans-serif" font-size="18">POST /v1/audio/speech · voice=own:sw-aisha</text>
