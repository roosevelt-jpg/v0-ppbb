<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Creative voice">
  <defs>
    <linearGradient id="usecreativesky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#180f1a"/>
      <stop offset="100%" stop-color="#4a1a6b"/>
    </linearGradient>
    <radialGradient id="usecreativeglow" cx="72%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#c49ae8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c49ae8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="usecreativeface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c49ae8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6a3a9a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="usecreativeside" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a3a9a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#180f1a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="usecreativefloor" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="usecreativesoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#usecreativesky)"/>
  <rect width="1200" height="720" fill="url(#usecreativeglow)"/>
  <!-- anamorphic perspective floor -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" fill="none">
    <path d="M80 620 L600 390 L1120 620"/>
    <path d="M160 620 L600 410 L1040 620"/>
    <path d="M240 620 L600 430 L960 620"/>
    <path d="M320 620 L600 450 L880 620"/>
    <path d="M400 620 L600 470 L800 620"/>
    <path d="M200 560 L1000 560"/>
    <path d="M260 590 L940 590"/>
    <path d="M340 640 L860 640"/>
  </g>
  <ellipse cx="600" cy="560" rx="340" ry="48" fill="url(#usecreativefloor)" filter="url(#usecreativesoft)"/>
  
  <g transform="translate(700 300) skewX(-16)">
    <rect x="-30" y="-140" width="70" height="280" rx="20" fill="url(#usecreativeside)"/>
    <rect x="-90" y="-100" width="70" height="220" rx="20" fill="url(#usecreativeface)" opacity="0.85"/>
    <rect x="40" y="-60" width="70" height="180" rx="20" fill="url(#usecreativeface)" opacity="0.65"/>
  </g>
  <g transform="translate(300 260)">
    <ellipse cx="40" cy="130" rx="100" ry="22" fill="#000" opacity="0.2" filter="url(#usecreativesoft)"/>
    <path d="M0 0 C 60 -100, 180 -40, 160 40 C 120 100, 20 90, 0 0 Z" fill="url(#usecreativeface)"/>
    <ellipse cx="70" cy="-10" rx="36" ry="18" fill="#fff" opacity="0.28"/>
  </g>
  <text x="56" y="668" fill="#f7fffb" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Creative voice</text>
</svg>
