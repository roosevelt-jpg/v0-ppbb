<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Education">
  <defs>
    <linearGradient id="useeducationsky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1420"/>
      <stop offset="100%" stop-color="#1a4a6b"/>
    </linearGradient>
    <radialGradient id="useeducationglow" cx="72%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#7eb8e8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7eb8e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="useeducationface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7eb8e8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2a6a9a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="useeducationside" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a6a9a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a1420" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="useeducationfloor" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="useeducationsoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#useeducationsky)"/>
  <rect width="1200" height="720" fill="url(#useeducationglow)"/>
  <!-- anamorphic perspective floor -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" fill="none">
    <path d="M80 620 L600 390 L1120 620"/>
    <path d="M160 620 L600 410 L1040 620"/>
    <path d="M240 620 L600 430 L960 620"/>
    <path d="M320 620 L600 450 L880 620"/>
    <path d="M400 620 L600 470 L800 620"/>
    <path d="M200 560 L1000 560"/>
    <path d="M260 590 L940 590"/>
    <path d="M340 640 L860 640"/>
  </g>
  <ellipse cx="600" cy="560" rx="340" ry="48" fill="url(#useeducationfloor)" filter="url(#useeducationsoft)"/>
  
  <g transform="translate(640 300) skewX(-10)">
    <path d="M-180 40 L0 -90 L180 40 L0 90 Z" fill="url(#useeducationside)" opacity="0.5"/>
    <path d="M-150 30 L0 -60 L150 30 L0 70 Z" fill="url(#useeducationface)"/>
    <rect x="-20" y="-10" width="40" height="90" fill="#083226" opacity="0.25"/>
  </g>
  <g transform="translate(300 250)">
    <ellipse cx="20" cy="110" rx="80" ry="18" fill="#000" opacity="0.2" filter="url(#useeducationsoft)"/>
    <rect x="-60" y="-80" width="140" height="180" rx="16" fill="url(#useeducationface)"/>
    <rect x="-40" y="-50" width="100" height="14" rx="7" fill="#fff" opacity="0.35"/>
    <rect x="-40" y="-20" width="80" height="14" rx="7" fill="#fff" opacity="0.28"/>
    <rect x="-40" y="10" width="90" height="14" rx="7" fill="#fff" opacity="0.22"/>
  </g>
  <text x="56" y="668" fill="#f7fffb" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Education</text>
</svg>
