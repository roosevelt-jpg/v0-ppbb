<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Sales and marketing">
  <defs>
    <linearGradient id="usesalessky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f14"/>
      <stop offset="100%" stop-color="#6b1a3a"/>
    </linearGradient>
    <radialGradient id="usesalesglow" cx="72%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#e08aaa" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#e08aaa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="usesalesface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e08aaa" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9a3a5a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="usesalesside" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3a5a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0f14" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="usesalesfloor" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="usesalessoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#usesalessky)"/>
  <rect width="1200" height="720" fill="url(#usesalesglow)"/>
  <!-- anamorphic perspective floor -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" fill="none">
    <path d="M80 620 L600 390 L1120 620"/>
    <path d="M160 620 L600 410 L1040 620"/>
    <path d="M240 620 L600 430 L960 620"/>
    <path d="M320 620 L600 450 L880 620"/>
    <path d="M400 620 L600 470 L800 620"/>
    <path d="M200 560 L1000 560"/>
    <path d="M260 590 L940 590"/>
    <path d="M340 640 L860 640"/>
  </g>
  <ellipse cx="600" cy="560" rx="340" ry="48" fill="url(#usesalesfloor)" filter="url(#usesalessoft)"/>
  
  <g transform="translate(700 320) skewX(-14)">
    <rect x="-140" y="30" width="40" height="50" rx="10" fill="url(#usesalesface)" opacity="0.5"/><rect x="-85" y="-2" width="40" height="82" rx="10" fill="url(#usesalesface)" opacity="0.6"/><rect x="-30" y="-34" width="40" height="114" rx="10" fill="url(#usesalesface)" opacity="0.7"/><rect x="25" y="-66" width="40" height="146" rx="10" fill="url(#usesalesface)" opacity="0.8"/><rect x="80" y="-98" width="40" height="178" rx="10" fill="url(#usesalesface)" opacity="0.9"/>
  </g>
  <g transform="translate(280 280)">
    <ellipse cx="30" cy="120" rx="90" ry="20" fill="#000" opacity="0.2" filter="url(#usesalessoft)"/>
    <circle r="78" fill="url(#usesalesface)"/>
    <path d="M-30 10 L0 -35 L30 10 Z" fill="#fff" opacity="0.35"/>
    <rect x="-8" y="10" width="16" height="36" fill="#fff" opacity="0.3"/>
  </g>
  <text x="56" y="668" fill="#f7fffb" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Sales and marketing</text>
</svg>
