<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="VerbaSpeech">
  <defs>
    <linearGradient id="productspeechsky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1c24"/>
      <stop offset="100%" stop-color="#165a6b"/>
    </linearGradient>
    <radialGradient id="productspeechglow" cx="72%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#6fd0cf" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6fd0cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="productspeechface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fd0cf" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a6b7a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="productspeechside" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a6b7a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a1c24" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="productspeechfloor" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="productspeechsoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#productspeechsky)"/>
  <rect width="1200" height="720" fill="url(#productspeechglow)"/>
  <!-- anamorphic perspective floor -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" fill="none">
    <path d="M80 620 L600 390 L1120 620"/>
    <path d="M160 620 L600 410 L1040 620"/>
    <path d="M240 620 L600 430 L960 620"/>
    <path d="M320 620 L600 450 L880 620"/>
    <path d="M400 620 L600 470 L800 620"/>
    <path d="M200 560 L1000 560"/>
    <path d="M260 590 L940 590"/>
    <path d="M340 640 L860 640"/>
  </g>
  <ellipse cx="600" cy="560" rx="340" ry="48" fill="url(#productspeechfloor)" filter="url(#productspeechsoft)"/>
  
  <g transform="translate(700 280) skewX(-12)">
    <rect x="-180" y="-90" width="360" height="180" rx="28" fill="url(#productspeechside)" opacity="0.9"/>
    <rect x="-150" y="-60" width="300" height="120" rx="18" fill="url(#productspeechface)"/>
    <rect x="-120" y="-20" width="48" height="12" rx="6" fill="#fff" opacity="0.35"/><rect x="-50" y="-10" width="48" height="12" rx="6" fill="#fff" opacity="0.35"/><rect x="20" y="-20" width="48" height="12" rx="6" fill="#fff" opacity="0.35"/><rect x="90" y="-10" width="48" height="12" rx="6" fill="#fff" opacity="0.35"/>
  </g>
  <g transform="translate(300 320)">
    <ellipse cx="20" cy="90" rx="70" ry="18" fill="#000" opacity="0.2" filter="url(#productspeechsoft)"/>
    <circle cx="0" cy="0" r="70" fill="url(#productspeechface)"/>
    <path d="M55 35 L120 80 L55 70 Z" fill="url(#productspeechside)"/>
    <circle cx="-18" cy="-16" r="18" fill="#fff" opacity="0.3"/>
  </g>
  <text x="56" y="668" fill="#f7fffb" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">VerbaSpeech</text>
</svg>
