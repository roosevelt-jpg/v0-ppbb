<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Public speech">
  <defs>
    <linearGradient id="usepublicspeechsky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101418"/>
      <stop offset="100%" stop-color="#2a3a4a"/>
    </linearGradient>
    <radialGradient id="usepublicspeechglow" cx="72%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#9ad0c0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9ad0c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="usepublicspeechface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ad0c0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3a7a6a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="usepublicspeechside" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a7a6a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#101418" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="usepublicspeechfloor" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="usepublicspeechsoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#usepublicspeechsky)"/>
  <rect width="1200" height="720" fill="url(#usepublicspeechglow)"/>
  <!-- anamorphic perspective floor -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" fill="none">
    <path d="M80 620 L600 390 L1120 620"/>
    <path d="M160 620 L600 410 L1040 620"/>
    <path d="M240 620 L600 430 L960 620"/>
    <path d="M320 620 L600 450 L880 620"/>
    <path d="M400 620 L600 470 L800 620"/>
    <path d="M200 560 L1000 560"/>
    <path d="M260 590 L940 590"/>
    <path d="M340 640 L860 640"/>
  </g>
  <ellipse cx="600" cy="560" rx="340" ry="48" fill="url(#usepublicspeechfloor)" filter="url(#usepublicspeechsoft)"/>
  
  <g transform="translate(660 300) skewX(-12)">
    <ellipse cx="0" cy="0" rx="200" ry="70" fill="none" stroke="url(#usepublicspeechface)" stroke-width="18" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="140" ry="48" fill="none" stroke="url(#usepublicspeechface)" stroke-width="14" opacity="0.75"/>
    <ellipse cx="0" cy="0" rx="80" ry="28" fill="url(#usepublicspeechface)"/>
  </g>
  <g transform="translate(300 300)">
    <ellipse cx="20" cy="110" rx="70" ry="16" fill="#000" opacity="0.2" filter="url(#usepublicspeechsoft)"/>
    <rect x="-24" y="-20" width="48" height="130" rx="12" fill="url(#usepublicspeechside)"/>
    <circle cy="-50" r="48" fill="url(#usepublicspeechface)"/>
    <circle cx="-14" cy="-62" r="12" fill="#fff" opacity="0.3"/>
  </g>
  <text x="56" y="668" fill="#f7fffb" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Public speech</text>
</svg>
