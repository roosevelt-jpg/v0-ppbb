<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Trade and negotiations">
  <defs>
    <linearGradient id="usetradesky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14100a"/>
      <stop offset="100%" stop-color="#5a3d14"/>
    </linearGradient>
    <radialGradient id="usetradeglow" cx="72%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#e0b36f" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#e0b36f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="usetradeface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0b36f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8a5a22" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="usetradeside" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a5a22" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#14100a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="usetradefloor" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="usetradesoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#usetradesky)"/>
  <rect width="1200" height="720" fill="url(#usetradeglow)"/>
  <!-- anamorphic perspective floor -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" fill="none">
    <path d="M80 620 L600 390 L1120 620"/>
    <path d="M160 620 L600 410 L1040 620"/>
    <path d="M240 620 L600 430 L960 620"/>
    <path d="M320 620 L600 450 L880 620"/>
    <path d="M400 620 L600 470 L800 620"/>
    <path d="M200 560 L1000 560"/>
    <path d="M260 590 L940 590"/>
    <path d="M340 640 L860 640"/>
  </g>
  <ellipse cx="600" cy="560" rx="340" ry="48" fill="url(#usetradefloor)" filter="url(#usetradesoft)"/>
  
  <g transform="translate(650 310) skewX(-18)">
    <polygon points="-160,80 0,-120 160,80" fill="url(#usetradeside)" opacity="0.55"/>
    <polygon points="-120,80 0,-70 120,80" fill="url(#usetradeface)"/>
    <rect x="-26" y="10" width="52" height="70" fill="#083226" opacity="0.35"/>
  </g>
  <g transform="translate(280 360) skewY(-6)">
    <rect x="0" y="0" width="160" height="24" rx="8" fill="url(#usetradeface)"/>
    <rect x="20" y="-40" width="160" height="24" rx="8" fill="url(#usetradeside)" opacity="0.8"/>
    <rect x="40" y="-80" width="160" height="24" rx="8" fill="url(#usetradeface)" opacity="0.65"/>
  </g>
  <text x="56" y="668" fill="#f7fffb" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Trade and negotiations</text>
</svg>
