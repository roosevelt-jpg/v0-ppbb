<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="VerbaTranslate">
  <defs>
    <linearGradient id="producttranslatesky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a140a"/>
      <stop offset="100%" stop-color="#6b4a1a"/>
    </linearGradient>
    <radialGradient id="producttranslateglow" cx="72%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#e2c07a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#e2c07a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="producttranslateface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2c07a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8a6230" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="producttranslateside" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a6230" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a140a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="producttranslatefloor" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="producttranslatesoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#producttranslatesky)"/>
  <rect width="1200" height="720" fill="url(#producttranslateglow)"/>
  <!-- anamorphic perspective floor -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" fill="none">
    <path d="M80 620 L600 390 L1120 620"/>
    <path d="M160 620 L600 410 L1040 620"/>
    <path d="M240 620 L600 430 L960 620"/>
    <path d="M320 620 L600 450 L880 620"/>
    <path d="M400 620 L600 470 L800 620"/>
    <path d="M200 560 L1000 560"/>
    <path d="M260 590 L940 590"/>
    <path d="M340 640 L860 640"/>
  </g>
  <ellipse cx="600" cy="560" rx="340" ry="48" fill="url(#producttranslatefloor)" filter="url(#producttranslatesoft)"/>
  
  <g transform="translate(620 300) skewX(-16)">
    <rect x="-40" y="-130" width="200" height="260" rx="24" fill="url(#producttranslateside)"/>
    <rect x="-160" y="-100" width="200" height="260" rx="24" fill="url(#producttranslateface)" opacity="0.92"/>
    <text x="-120" y="20" fill="#083226" font-family="Arial" font-size="54" font-weight="700">A</text>
    <text x="30" y="20" fill="#eafff5" font-family="Arial" font-size="54" font-weight="700">語</text>
  </g>
  <g transform="translate(980 220)">
    <ellipse cx="10" cy="80" rx="50" ry="14" fill="#000" opacity="0.2" filter="url(#producttranslatesoft)"/>
    <circle r="54" fill="url(#producttranslateface)"/>
    <path d="M-20 -10 h40 M0 -30 v40" stroke="#083226" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="56" y="668" fill="#f7fffb" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">VerbaTranslate</text>
</svg>
