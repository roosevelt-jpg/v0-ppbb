<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="VerbaVoice">
  <defs>
    <linearGradient id="productvoicesky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d241c"/>
      <stop offset="100%" stop-color="#145c46"/>
    </linearGradient>
    <radialGradient id="productvoiceglow" cx="72%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#7dE0B0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7dE0B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="productvoiceface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dE0B0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a6b52" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="productvoiceside" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a6b52" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d241c" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="productvoicefloor" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="productvoicesoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#productvoicesky)"/>
  <rect width="1200" height="720" fill="url(#productvoiceglow)"/>
  <!-- anamorphic perspective floor -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" fill="none">
    <path d="M80 620 L600 390 L1120 620"/>
    <path d="M160 620 L600 410 L1040 620"/>
    <path d="M240 620 L600 430 L960 620"/>
    <path d="M320 620 L600 450 L880 620"/>
    <path d="M400 620 L600 470 L800 620"/>
    <path d="M200 560 L1000 560"/>
    <path d="M260 590 L940 590"/>
    <path d="M340 640 L860 640"/>
  </g>
  <ellipse cx="600" cy="560" rx="340" ry="48" fill="url(#productvoicefloor)" filter="url(#productvoicesoft)"/>
  
  <g transform="translate(640 300) skewX(-14)">
    <g transform="translate(-160 0)">
        <rect x="0" y="-40" width="36" height="80" rx="12" fill="url(#productvoiceface)" opacity="0.55"/>
        <rect x="10" y="-32" width="16" height="64" rx="8" fill="#fff" opacity="0.18"/>
      </g><g transform="translate(-105 0)">
        <rect x="0" y="-68" width="36" height="136" rx="12" fill="url(#productvoiceface)" opacity="0.6200000000000001"/>
        <rect x="10" y="-60" width="16" height="120" rx="8" fill="#fff" opacity="0.18"/>
      </g><g transform="translate(-50 0)">
        <rect x="0" y="-96" width="36" height="192" rx="12" fill="url(#productvoiceface)" opacity="0.6900000000000001"/>
        <rect x="10" y="-88" width="16" height="176" rx="8" fill="#fff" opacity="0.18"/>
      </g><g transform="translate(5 0)">
        <rect x="0" y="-124" width="36" height="248" rx="12" fill="url(#productvoiceface)" opacity="0.76"/>
        <rect x="10" y="-116" width="16" height="232" rx="8" fill="#fff" opacity="0.18"/>
      </g><g transform="translate(60 0)">
        <rect x="0" y="-152" width="36" height="304" rx="12" fill="url(#productvoiceface)" opacity="0.8300000000000001"/>
        <rect x="10" y="-144" width="16" height="288" rx="8" fill="#fff" opacity="0.18"/>
      </g><g transform="translate(115 0)">
        <rect x="0" y="-180" width="36" height="360" rx="12" fill="url(#productvoiceface)" opacity="0.9000000000000001"/>
        <rect x="10" y="-172" width="16" height="344" rx="8" fill="#fff" opacity="0.18"/>
      </g>
  </g>
  <g transform="translate(260 250)">
    <ellipse cx="30" cy="120" rx="90" ry="22" fill="#000" opacity="0.22" filter="url(#productvoicesoft)"/>
    <path d="M0 0 C 40 -80, 140 -80, 180 0 C 140 70, 40 70, 0 0 Z" fill="url(#productvoiceface)"/>
    <ellipse cx="90" cy="-10" rx="48" ry="20" fill="#fff" opacity="0.25"/>
  </g>
  <text x="56" y="668" fill="#f7fffb" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">VerbaVoice</text>
</svg>
