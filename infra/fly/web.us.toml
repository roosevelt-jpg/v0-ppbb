# Fly.io — Web US residency island. Point NEXT_PUBLIC_API_URL at verbalab-api-us.
# fly apps create verbalab-web-us
app = 'verbalab-web-us'
primary_region = 'iad'

[build]
  dockerfile = 'apps/web/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  VERBALAB_REGION = 'us'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
